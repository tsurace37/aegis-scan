name: Publish to PyPI

# Builds and publishes the aegis-scan-ai package to PyPI whenever a
# GitHub Release is published. Uses PyPI's "trusted publishing" (OIDC) --
# no API token is stored anywhere, in this repo or elsewhere. This
# requires a one-time setup step on pypi.org (see README's "Releasing"
# section) before the first release can publish successfully.

on:
  release:
    types: [published]
  workflow_dispatch: {}  # allows a manual re-run from the Actions tab if a release publish needs retrying

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi  # matches the "Environment name" set on pypi.org's trusted publisher config
    permissions:
      id-token: write  # required for OIDC trusted publishing -- do not remove
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
