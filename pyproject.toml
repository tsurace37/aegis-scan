[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aegis-scan-ai"
version = "0.1.0"
description = "Open-source detection of data poisoning and backdoor attacks in ML classification pipelines, validated on healthcare imaging and general-purpose benchmarks."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Suresh Tamang" }]
keywords = ["ai-security", "backdoor-detection", "data-poisoning", "mitre-atlas", "nist-ai-rmf", "healthcare-ai"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Healthcare Industry",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "torch>=2.2",
    "torchvision>=0.17",
    "medmnist>=3.0",
    "numpy>=1.26",
    "scipy>=1.11",
    "scikit-learn>=1.4",
]

[project.urls]
Homepage = "https://github.com/tsurace37/aegis-scan"
Repository = "https://github.com/tsurace37/aegis-scan"
Issues = "https://github.com/tsurace37/aegis-scan/issues"
Paper = "https://arxiv.org/abs/2609.14290"

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
aegis-scan = "aegis_scan.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
